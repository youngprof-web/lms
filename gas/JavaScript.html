// ==============================================================================
// SERVER INTERACTION WRAPPER (google.script.run with Promise & Fallback)
// ==============================================================================

function runServer(funcName, ...args) {
  return new Promise((resolve, reject) => {
    // Check if running inside Google Apps Script iframe environment
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(response => resolve(response))
        .withFailureHandler(err => reject(err))
        [funcName](...args);
    } else {
      // Execute local simulation when running in preview/development
      simulateServerExecution(funcName, args, resolve, reject);
    }
  });
}

function simulateServerExecution(funcName, args, resolve, reject) {
  setTimeout(() => {
    try {
      switch (funcName) {
        case 'apiLogin': {
          const [email, password] = args;
          const user = MOCK_DB.users.find(u => u.email.toLowerCase() === email.toLowerCase());
          if (!user) {
            return reject(new Error('Invalid email or password credentials.'));
          }
          if (user.isTemporal && user.temporalExpiresAt) {
            if (Date.now() > new Date(user.temporalExpiresAt).getTime()) {
              user.status = 'expired';
              return reject(new Error('Temporary login session has expired.'));
            }
          }
          if (user.status !== 'active') {
            return reject(new Error('Account is inactive or expired.'));
          }
          if (!user.anonymousAlias) {
            user.anonymousAlias = 'Anonymous ' + (user.role || 'Scholar') + ' #' + Math.floor(100 + Math.random() * 900);
          }
          resolve(user);
          break;
        }
        case 'apiRegister': {
          const [userData] = args;
          const role = userData.role || 'student';
          const alias = userData.anonymousAlias || ('Anonymous ' + (role.charAt(0).toUpperCase() + role.slice(1)) + ' #' + Math.floor(100 + Math.random() * 900));
          const newUser = {
            id: 'usr_' + Date.now().toString(36),
            name: userData.name,
            email: userData.email,
            role: role,
            status: 'active',
            avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150',
            anonymousAlias: alias,
            isTemporal: false,
            joined: new Date().toISOString().split('T')[0]
          };
          MOCK_DB.users.push(newUser);
          resolve(newUser);
          break;
        }
        case 'apiCreateTemporalLogin': {
          const [role, durationMinutes] = args;
          const duration = parseInt(durationMinutes, 10) || 60;
          const targetRole = role === 'admin' ? 'admin' : (role === 'lecturer' ? 'lecturer' : 'student');
          const id = 'temp_' + Date.now().toString(36);
          const alias = 'Ephemeral ' + (targetRole.charAt(0).toUpperCase() + targetRole.slice(1)) + ' #' + Math.floor(100 + Math.random() * 900);
          const expiresAt = new Date(Date.now() + duration * 60 * 1000).toISOString();
          const token = 'tok_' + Math.random().toString(36).substring(2, 12);
          const tempUser = {
            id: id,
            name: 'Temporary ' + (targetRole.charAt(0).toUpperCase() + targetRole.slice(1)),
            email: id + '@ephemeral.lms',
            role: targetRole,
            status: 'active',
            avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150',
            anonymousAlias: alias,
            isTemporal: true,
            temporalToken: token,
            temporalExpiresAt: expiresAt,
            joined: new Date().toISOString().split('T')[0]
          };
          MOCK_DB.users.push(tempUser);
          resolve(tempUser);
          break;
        }
        case 'apiValidateSession': {
          const [userId, temporalToken] = args;
          const user = MOCK_DB.users.find(u => u.id === userId);
          if (!user) return resolve({ valid: false });
          if (user.isTemporal && user.temporalExpiresAt) {
            const exp = new Date(user.temporalExpiresAt).getTime();
            if (Date.now() > exp) {
              user.status = 'expired';
              return resolve({ valid: false, message: 'Session expired' });
            }
            return resolve({
              valid: true,
              user: user,
              isTemporal: true,
              remainingSeconds: Math.max(0, Math.round((exp - Date.now()) / 1000))
            });
          }
          resolve({ valid: true, user: user, isTemporal: false });
          break;
        }
        case 'apiExtendTemporalSession': {
          const [userId, temporalToken, additionalMinutes] = args;
          const user = MOCK_DB.users.find(u => u.id === userId);
          if (!user) return reject(new Error('User not found'));
          const mins = parseInt(additionalMinutes, 10) || 30;
          const currentExp = user.temporalExpiresAt ? new Date(user.temporalExpiresAt).getTime() : Date.now();
          const newExp = new Date(currentExp + mins * 60 * 1000).toISOString();
          user.temporalExpiresAt = newExp;
          user.status = 'active';
          resolve({
            success: true,
            temporalExpiresAt: newExp,
            remainingSeconds: Math.max(0, Math.round((new Date(newExp).getTime() - Date.now()) / 1000))
          });
          break;
        }
        case 'apiGetCourses': {
          resolve(MOCK_DB.courses);
          break;
        }
        case 'apiGetCourseDetail': {
          const [courseId, userId] = args;
          const course = MOCK_DB.courses.find(c => c.id === courseId);
          if (!course) return reject(new Error('Course not found'));
          const enrollment = MOCK_DB.enrollments.find(e => e.courseId === courseId && e.studentId === userId);
          resolve({
            course: course,
            modules: course.modules || [],
            materials: course.materials || [],
            assignments: course.assignments || [],
            quizzes: course.quizzes || [],
            enrollment: enrollment,
            completedLessonIds: enrollment ? (enrollment.completedLessonIds || []) : []
          });
          break;
        }
        case 'apiEnrollCourse': {
          const [studentId, courseId] = args;
          let enr = MOCK_DB.enrollments.find(e => e.studentId === studentId && e.courseId === courseId);
          if (!enr) {
            enr = { id: 'enr_' + Date.now(), studentId, courseId, progressPercentage: 0, status: 'active', completedLessonIds: [] };
            MOCK_DB.enrollments.push(enr);
          }
          resolve({ success: true, enrollment: enr });
          break;
        }
        case 'apiMarkLessonComplete': {
          const [studentId, courseId, lessonId] = args;
          let enr = MOCK_DB.enrollments.find(e => e.studentId === studentId && e.courseId === courseId);
          if (enr) {
            if (!enr.completedLessonIds) enr.completedLessonIds = [];
            if (!enr.completedLessonIds.includes(lessonId)) {
              enr.completedLessonIds.push(lessonId);
            }
            enr.progressPercentage = Math.min(100, Math.round((enr.completedLessonIds.length / 3) * 100));
          }
          resolve({ success: true, progress: enr ? enr.progressPercentage : 100 });
          break;
        }
        case 'apiSubmitAssignment': {
          const [data] = args;
          const newSub = {
            id: 'sub_' + Date.now(),
            assignmentId: data.assignmentId,
            assignmentTitle: data.assignmentTitle || 'Assignment',
            studentId: data.studentId,
            studentName: data.studentName,
            studentAnonymousAlias: data.studentAnonymousAlias || 'Anonymous Scholar #' + Math.floor(100 + Math.random() * 900),
            submittedAt: new Date().toISOString(),
            submissionText: data.submissionText,
            fileDriveUrl: data.fileDriveUrl || 'https://drive.google.com/uploaded-file',
            status: 'submitted',
            pointsEarned: '',
            feedback: ''
          };
          MOCK_DB.submissions.push(newSub);
          resolve({ success: true, submissionId: newSub.id });
          break;
        }
        case 'apiGradeSubmission': {
          const [submissionId, points, feedback] = args;
          const sub = MOCK_DB.submissions.find(s => s.id === submissionId);
          if (sub) {
            sub.pointsEarned = points;
            sub.feedback = feedback;
            sub.status = 'graded';
            MOCK_DB.grades.push({
              id: 'grd_' + Date.now(),
              studentId: sub.studentId,
              title: sub.assignmentTitle || 'Assignment',
              itemType: 'assignment',
              score: points,
              maxScore: 100,
              percentage: points,
              gradedAt: new Date().toISOString().split('T')[0],
              feedback: feedback
            });
          }
          resolve({ success: true });
          break;
        }
        case 'apiSubmitQuiz': {
          const [attempt] = args;
          let score = 0;
          let total = 100;
          const answers = attempt.answers || {};
          // Evaluate mock questions
          if (answers['que_1'] === '200 OK') score += 25;
          if (answers['que_2'] === '<nav>') score += 25;
          if (answers['que_3'] === '@media (min-width: ...)') score += 25;
          if (answers['que_4'] === 'Yes, on Google cloud servers') score += 25;

          const percentage = score;
          const passed = percentage >= 70;

          MOCK_DB.grades.push({
            id: 'grd_' + Date.now(),
            studentId: attempt.studentId,
            title: 'Module 1 Assessment',
            itemType: 'quiz',
            score: score,
            maxScore: total,
            percentage: percentage,
            gradedAt: new Date().toISOString().split('T')[0],
            feedback: passed ? 'Great work! You passed the assessment.' : 'Score below 70%. Review notes and retry.'
          });

          resolve({
            success: true,
            score: score,
            totalPoints: total,
            percentage: percentage,
            passed: passed,
            passPercentage: 70
          });
          break;
        }
        case 'apiAdminGetStats': {
          resolve({
            totalUsers: MOCK_DB.users.length,
            totalCourses: MOCK_DB.courses.length,
            totalEnrollments: MOCK_DB.enrollments.length,
            totalSubmissions: MOCK_DB.submissions.length,
            activeQuizzes: 3
          });
          break;
        }
        case 'apiAdminGetUsers': {
          resolve(MOCK_DB.users);
          break;
        }
        case 'apiAdminToggleUser': {
          const [userId, status] = args;
          const u = MOCK_DB.users.find(usr => usr.id === userId);
          if (u) u.status = status;
          resolve({ success: true, status });
          break;
        }
        case 'apiPostAnnouncement': {
          const [ann] = args;
          ann.id = 'ann_' + Date.now();
          ann.createdAt = new Date().toISOString().split('T')[0];
          MOCK_DB.announcements.unshift(ann);
          resolve({ success: true, announcement: ann });
          break;
        }
        case 'apiSendMessage': {
          const [msg] = args;
          msg.id = 'msg_' + Date.now();
          msg.sentAt = new Date().toLocaleTimeString();
          MOCK_DB.messages.unshift(msg);
          resolve({ success: true, message: msg });
          break;
        }
        default:
          resolve({ success: true });
      }
    } catch (e) {
      reject(e);
    }
  }, 120);
}

// ==============================================================================
// NAVIGATION & VIEW SWITCHING
// ==============================================================================

function navigate(viewName, params = {}) {
  LMS_STATE.currentView = viewName;
  toggleSidebar(false);

  // Hide all views
  const views = ['viewLanding', 'viewStudentDashboard', 'viewAllCourses', 'viewCoursePlayer', 'viewLecturerDashboard', 'viewAdminDashboard', 'viewAnnouncements', 'viewMessages', 'viewResults'];
  views.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = 'none';
  });

  const pageTitle = document.getElementById('pageHeaderTitle');

  switch (viewName) {
    case 'landing':
      document.getElementById('viewLanding').style.display = 'block';
      if (pageTitle) pageTitle.textContent = 'Learning Platform';
      renderLandingCourses();
      break;

    case 'studentDashboard':
    case 'studentCourses':
      document.getElementById('viewStudentDashboard').style.display = 'block';
      if (pageTitle) pageTitle.textContent = 'Student Dashboard';
      renderStudentDashboard();
      break;

    case 'allCourses':
      document.getElementById('viewAllCourses').style.display = 'block';
      if (pageTitle) pageTitle.textContent = 'Course Catalog';
      renderAllCoursesCatalog();
      break;

    case 'coursePlayer':
      document.getElementById('viewCoursePlayer').style.display = 'block';
      if (pageTitle) pageTitle.textContent = 'Course Lesson Player';
      if (params.courseId) {
        loadAndRenderCoursePlayer(params.courseId, params.lessonId);
      }
      break;

    case 'lecturerDashboard':
      document.getElementById('viewLecturerDashboard').style.display = 'block';
      if (pageTitle) pageTitle.textContent = 'Lecturer Studio';
      renderLecturerDashboard();
      break;

    case 'adminDashboard':
      document.getElementById('viewAdminDashboard').style.display = 'block';
      if (pageTitle) pageTitle.textContent = 'Admin Control Panel';
      renderAdminDashboard();
      break;

    case 'announcements':
      document.getElementById('viewAnnouncements').style.display = 'block';
      if (pageTitle) pageTitle.textContent = 'Announcements';
      renderAnnouncementsList();
      break;

    case 'messages':
      document.getElementById('viewMessages').style.display = 'block';
      if (pageTitle) pageTitle.textContent = 'Direct Messages';
      renderMessagesList();
      break;

    case 'assignments':
    case 'results':
      document.getElementById('viewResults').style.display = 'block';
      if (pageTitle) pageTitle.textContent = 'Academic Grades';
      renderGradesTable();
      break;
  }

  renderSidebarNav(LMS_STATE.currentRole);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleSidebar(open) {
  const sidebar = document.getElementById('appSidebar');
  const overlay = document.getElementById('sidebarOverlay');
  if (open) {
    sidebar.classList.add('open');
    overlay.classList.add('active');
  } else {
    sidebar.classList.remove('open');
    overlay.classList.remove('active');
  }
}

function renderLandingCourses() {

function renderAllCoursesCatalog() {

function handleCourseFilter() {
  const search = (document.getElementById('courseSearchInput')?.value || '').toLowerCase();
  const cat = document.getElementById('courseCategoryFilter')?.value || 'All';
  const lvl = document.getElementById('courseLevelFilter')?.value || 'All';

  const courses = LMS_STATE.courses.length ? LMS_STATE.courses : MOCK_DB.courses;
  const filtered = courses.filter(c => {
    const matchSearch = !search || c.title.toLowerCase().includes(search) || c.code.toLowerCase().includes(search);
    const matchCat = cat === 'All' || c.category === cat;
    const matchLvl = lvl === 'All' || c.level === lvl;
    return matchSearch && matchCat && matchLvl;
  });

  const grid = document.getElementById('allCoursesCatalogGrid');
  if (grid) {
    grid.innerHTML = filtered.length ? filtered.map(c => createCourseCardHtml(c, false)).join('') : '<div style="grid-column: 1/-1; text-align: center; padding: 2rem; color: var(--text-muted);">No matching courses found.</div>';
  }
}

function createCourseCardHtml(course, isEnrolled = false) {
  const enrolledItem = MOCK_DB.enrollments.find(e => e.courseId === course.id && e.studentId === (LMS_STATE.currentUser ? LMS_STATE.currentUser.id : ''));
  const progress = enrolledItem ? enrolledItem.progressPercentage : 0;

  return `
    <div class="course-card">
      <img src="${course.thumbnail}" alt="${course.title}" class="course-thumb">
      <div class="course-body">
        <div class="course-meta-tags">
          <span class="badge badge-primary">${course.category}</span>
          <span class="badge badge-warning">${course.level}</span>
          <span class="badge" style="background: #F1F5F9; color: var(--text-muted);">${course.duration || '6 Weeks'}</span>
        </div>
        <h3 class="course-title">${course.title}</h3>
        <p class="course-desc">${course.description}</p>
        
        ${enrolledItem ? `
          <div style="font-size: 12px; color: var(--text-muted); display: flex; justify-content: space-between; margin-top: 0.5rem;">
            <span>Course Progress</span>
            <span style="font-weight: 700; color: var(--primary);">${progress}%</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" style="width: ${progress}%;"></div>
          </div>
          <button class="btn btn-primary btn-sm" style="width: 100%; margin-top: 0.75rem;" onclick="navigate('coursePlayer', { courseId: '${course.id}' })">
            ▶ Continue Lesson

    </div>
  `;
}

function loadAndRenderCoursePlayer(courseId, targetLessonId) {
  showLoading(true, 'Loading curriculum & materials...');
  
  runServer('apiGetCourseDetail', courseId, LMS_STATE.currentUser?.id).then(detail => {
    showLoading(false);
    LMS_STATE.activeCourse = detail.course;
    
    // Set titles
    document.getElementById('playerCourseTitle').textContent = detail.course.title;
    document.getElementById('playerCourseInstructor').textContent = 'Instructor: ' + (detail.course.lecturerName || 'Faculty');
    
    // Progress
    const progress = detail.enrollment ? detail.enrollment.progressPercentage : 0;
    document.getElementById('playerProgressPercent').textContent = progress + '%';
    document.getElementById('playerProgressBar').style.width = progress + '%';

    // Build modules and lessons tree
    renderCurriculumSidebar(detail.modules, detail.completedLessonIds || [], targetLessonId);

    // Render materials list (Drive download files)
    renderPlayerMaterials(detail.materials);

  }).catch(err => {
    showLoading(false);
    showToast('Failed to load course: ' + err.message, 'danger');
  });
}

function renderCurriculumSidebar(modules, completedIds, targetLessonId) {
  const container = document.getElementById('playerCurriculumTree');
  if (!container) return;

  let allLessons = [];
  let firstLesson = null;

  let html = '';
  modules.forEach(mod => {
    html += `<div class="module-header">${mod.title}</div>`;
    if (mod.lessons && mod.lessons.length) {
      mod.lessons.forEach(les => {
        allLessons.push(les);
        if (!firstLesson) firstLesson = les;
        if (targetLessonId && les.id === targetLessonId) firstLesson = les;
        
        const isDone = completedIds.includes(les.id);
        html += `
          <div class="lesson-list-item ${firstLesson && firstLesson.id === les.id ? 'active' : ''}" id="navLesson_${les.id}" onclick="selectLesson('${les.id}')">
            <div style="display: flex; align-items: center; gap: 0.5rem; overflow: hidden;">
              <span>${les.contentType === 'video' ? '📹' : '📄'}</span>
              <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${les.title}</span>
            </div>
            ${isDone ? '<span style="color: var(--success); font-weight: 700;">✓</span>' : ''}
          </div>
        `;
      });
    }
  });

  container.innerHTML = html;
  LMS_STATE.activeCourseLessons = allLessons;

  if (firstLesson) {
    selectLesson(firstLesson.id);
  }
}

function selectLesson(lessonId) {
  const lesson = (LMS_STATE.activeCourseLessons || []).find(l => l.id === lessonId);
  if (!lesson) return;
  LMS_STATE.activeLesson = lesson;

  // Update active state in sidebar
  document.querySelectorAll('.lesson-list-item').forEach(el => el.classList.remove('active'));
  const activeNav = document.getElementById('navLesson_' + lessonId);
  if (activeNav) activeNav.classList.add('active');

  // Populate lesson view
  document.getElementById('playerLessonTitle').textContent = lesson.title;
  const badge = document.getElementById('playerLessonTypeBadge');
  badge.textContent = lesson.contentType === 'video' ? 'Video Lesson' : 'Reading Material';
  badge.className = 'badge ' + (lesson.contentType === 'video' ? 'badge-primary' : 'badge-warning');

  const videoWrap = document.getElementById('playerVideoWrapper');
  const videoIframe = document.getElementById('playerVideoIframe');
  const textContent = document.getElementById('playerTextContent');

  if (lesson.contentType === 'video' && lesson.contentUrl) {
    videoWrap.style.display = 'block';
    videoIframe.src = lesson.contentUrl;
  } else {
    videoWrap.style.display = 'none';
    videoIframe.src = '';
  }

  textContent.innerHTML = lesson.textContent ? `<p>${lesson.textContent}</p>` : '<p style="color: var(--text-muted);">No textual supplementary notes provided for this lesson.</p>';
}

function navigateLesson(delta) {
  const list = LMS_STATE.activeCourseLessons || [];
  if (!list.length || !LMS_STATE.activeLesson) return;
  const currIdx = list.findIndex(l => l.id === LMS_STATE.activeLesson.id);
  const newIdx = currIdx + delta;
  if (newIdx >= 0 && newIdx < list.length) {
    selectLesson(list[newIdx].id);
  } else {
    showToast(delta > 0 ? 'You are at the final lesson of this course!' : 'You are at the first lesson.', 'info');
  }
}

function markCurrentLessonComplete() {
  if (!LMS_STATE.activeLesson || !LMS_STATE.activeCourse) return;
  
  showLoading(true, 'Recording progress in Google Sheets...');
  runServer('apiMarkLessonComplete', LMS_STATE.currentUser?.id, LMS_STATE.activeCourse.id, LMS_STATE.activeLesson.id).then(res => {
    showLoading(false);
    showToast('Lesson marked as completed! Progress: ' + res.progress + '%', 'success');
    document.getElementById('playerProgressPercent').textContent = res.progress + '%';
    document.getElementById('playerProgressBar').style.width = res.progress + '%';
  }).catch(err => {
    showLoading(false);
    showToast('Error: ' + err.message, 'danger');
  });
}

function renderPlayerMaterials(materials) {
  const container = document.getElementById('playerMaterialsList');
  if (!container) return;

  if (!materials || !materials.length) {
    container.innerHTML = '<div style="font-size: 13px; color: var(--text-muted);">No downloadable resources attached.</div>';
    return;
  }

  container.innerHTML = materials.map(m => `
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 0.65rem 0.85rem; background: var(--bg-main); border-radius: var(--radius-md);">
      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <span>📑</span>
        <div>
          <div style="font-weight: 600; font-size: 13px;">${m.title}</div>
          <div style="font-size: 11px; color: var(--text-muted);">${m.fileSize || 'PDF Document'}</div>
        </div>
      </div>
      <a href="${m.driveDownloadUrl || 'https://drive.google.com'}" target="_blank" class="btn btn-secondary btn-sm" style="font-size: 12px;">
        ⬇ Download
      </a>
    </div>
  `).join('');
}

// ==============================================================================
// QUIZ ENGINE & AUTOMATIC EVALUATION
// ==============================================================================

function openActiveCourseQuiz() {
  const course = LMS_STATE.activeCourse || MOCK_DB.courses[0];
  const quiz = (course.quizzes && course.quizzes.length) ? course.quizzes[0] : MOCK_DB.courses[0].quizzes[0];
  if (!quiz) {
    showToast('No quiz available for this module.', 'warning');
    return;
  }

  LMS_STATE.activeQuiz = quiz;
  LMS_STATE.activeQuizAttempt = {
    answers: {},
    currentQuestionIdx: 0,
    timeLeft: (quiz.timeLimitMinutes || 15) * 60
  };

  document.getElementById('quizModalTitle').textContent = quiz.title;
  document.getElementById('quizQuestionContainer').style.display = 'block';
  document.getElementById('quizSummaryContainer').style.display = 'none';
  document.getElementById('quizFooterActions').style.display = 'flex';

  openModal('modalQuiz');
  renderQuizQuestionStep();
  startQuizTimer();
}

function renderQuizQuestionStep() {
  const quiz = LMS_STATE.activeQuiz;
  const questions = quiz.questions || [];
  const idx = LMS_STATE.activeQuizAttempt.currentQuestionIdx;
  const q = questions[idx];

  document.getElementById('quizProgressDots').textContent = `Question ${idx + 1} of ${questions.length}`;

  const container = document.getElementById('quizQuestionContainer');
  if (!q) return;

  const currentAnswer = LMS_STATE.activeQuizAttempt.answers[q.id] || '';

  container.innerHTML = `
    <div style="margin-bottom: 1.25rem;">
      <span class="badge badge-primary" style="margin-bottom: 0.5rem;">Question ${idx + 1}</span>
      <h4 style="font-size: 1.15rem; margin-top: 0.25rem;">${q.questionText}</h4>
    </div>
    <div id="quizOptionsList">
      ${(q.options || []).map(opt => `
        <div class="quiz-option-card ${currentAnswer === opt ? 'selected' : ''}" onclick="selectQuizAnswer('${q.id}', '${opt.replace(/'/g, "\\'")}')">
          <input type="radio" name="quizOpt_${q.id}" ${currentAnswer === opt ? 'checked' : ''} style="margin-right: 0.5rem;">
          <span>${opt}</span>
        </div>
      `).join('')}
    </div>
  `;

  // Control prev/next/submit buttons
  document.getElementById('btnQuizPrev').style.display = idx > 0 ? 'inline-flex' : 'none';
  const isLast = idx === questions.length - 1;
  document.getElementById('btnQuizNext').style.display = isLast ? 'none' : 'inline-flex';
  document.getElementById('btnQuizSubmit').style.display = isLast ? 'inline-flex' : 'none';
}

function selectQuizAnswer(questionId, answer) {
  LMS_STATE.activeQuizAttempt.answers[questionId] = answer;
  renderQuizQuestionStep();
}

function navQuizQuestion(delta) {
  const questions = LMS_STATE.activeQuiz.questions || [];
  const newIdx = LMS_STATE.activeQuizAttempt.currentQuestionIdx + delta;
  if (newIdx >= 0 && newIdx < questions.length) {
    LMS_STATE.activeQuizAttempt.currentQuestionIdx = newIdx;
    renderQuizQuestionStep();
  }
}

function startQuizTimer() {
  clearInterval(LMS_STATE.activeQuizAttempt.timerInterval);
  const timerText = document.getElementById('quizTimerText');

  LMS_STATE.activeQuizAttempt.timerInterval = setInterval(() => {
    LMS_STATE.activeQuizAttempt.timeLeft--;
    const m = Math.floor(LMS_STATE.activeQuizAttempt.timeLeft / 60);
    const s = LMS_STATE.activeQuizAttempt.timeLeft % 60;
    if (timerText) {
      timerText.textContent = `Time Remaining: ${m}:${s < 10 ? '0' : ''}${s}`;
    }
    if (LMS_STATE.activeQuizAttempt.timeLeft <= 0) {
      clearInterval(LMS_STATE.activeQuizAttempt.timerInterval);
      showToast('Time expired! Submitting your answers automatically.', 'warning');
      submitActiveQuiz();
    }
  }, 1000);
}

function submitActiveQuiz() {
  clearInterval(LMS_STATE.activeQuizAttempt.timerInterval);
  showLoading(true, 'Grading assessment against question keys...');

  const attemptData = {
    quizId: LMS_STATE.activeQuiz.id,
    studentId: LMS_STATE.currentUser?.id || 'usr_stud_1',
    answers: LMS_STATE.activeQuizAttempt.answers
  };

  runServer('apiSubmitQuiz', attemptData).then(result => {
    showLoading(false);
    
    // Display result summary
    document.getElementById('quizQuestionContainer').style.display = 'none';
    document.getElementById('quizFooterActions').style.display = 'none';
    
    const summary = document.getElementById('quizSummaryContainer');
    summary.style.display = 'block';
    summary.innerHTML = `
      <div style="font-size: 3rem; margin-bottom: 0.5rem;">${result.passed ? '🎉' : '📖'}</div>
      <h3 style="font-size: 1.5rem; margin-bottom: 0.5rem;">${result.passed ? 'Assessment Passed!' : 'Assessment Incomplete'}</h3>
      <p style="color: var(--text-muted); margin-bottom: 1.25rem;">
        You scored <strong>${result.score}</strong> out of <strong>${result.totalPoints}</strong> (${result.percentage}%).
        Required passing score: ${result.passPercentage}%.
      </p>
      <div style="display: flex; justify-content: center; gap: 0.75rem;">
        <button class="btn btn-primary" onclick="closeModal('modalQuiz'); navigate('results');">View All Grades</button>
        <button class="btn btn-secondary" onclick="closeModal('modalQuiz');">Return to Course</button>
      </div>
    `;
  }).catch(err => {
    showLoading(false);
    showToast('Failed to evaluate quiz: ' + err.message, 'danger');
  });
}

function openActiveCourseAssignment() {
  const course = LMS_STATE.activeCourse || MOCK_DB.courses[0];
  const asg = (course.assignments && course.assignments.length) ? course.assignments[0] : MOCK_DB.courses[0].assignments[0];
  if (!asg) {
    showToast('No active assignments found for this course.', 'info');
    return;
  }
  document.getElementById('asgSubmitTitle').textContent = 'Submit: ' + asg.title;
  document.getElementById('asgSubmitDesc').textContent = asg.description + ' (Max Points: ' + asg.maxPoints + ')';
  openModal('modalAssignmentSubmit');
}

function handleAssignmentSubmit(e) {
  e.preventDefault();
  const notes = document.getElementById('asgNotesInput').value;
  const fileInput = document.getElementById('asgFileInput');
  const file = fileInput.files[0];

  showLoading(true, file ? 'Uploading attachment to Google Drive...' : 'Saving submission...');

  const processSubmission = (driveUrl) => {
    const payload = {
      assignmentId: 'asg_1',
      assignmentTitle: 'Project 1: Responsive Portfolio Layout',
      studentId: LMS_STATE.currentUser?.id || 'usr_stud_1',
      studentName: LMS_STATE.currentUser?.name || 'Alex Rivera',
      submissionText: notes,
      fileDriveUrl: driveUrl
    };

    runServer('apiSubmitAssignment', payload).then(res => {
      showLoading(false);
      closeModal('modalAssignmentSubmit');
      showToast('Assignment successfully submitted to instructor!', 'success');
      e.target.reset();
    }).catch(err => {
      showLoading(false);
      showToast('Submission error: ' + err.message, 'danger');
    });
  };

  if (file) {
    // Read file as Base64 for Google Apps Script DriveApp upload
    const reader = new FileReader();
    reader.onload = function(evt) {
      const base64 = evt.target.result;
      runServer('apiUploadToDrive', base64, file.name, file.type).then(res => {
        processSubmission(res.viewUrl || res.downloadUrl);
      }).catch(() => {
        // Fallback simulated drive upload link
        processSubmission('https://drive.google.com/demo-upload/' + encodeURIComponent(file.name));
      });
    };
    reader.readAsDataURL(file);
  } else {
    processSubmission('');
  }
}

            <button class="btn btn-secondary btn-sm" onclick="showToast('Edit modal for ${c.code} opened.', 'info')">Edit</button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  // Pending Submissions Table
  const subsBody = document.getElementById('lecturerSubmissionsTableBody');
  if (subsBody) {
    subsBody.innerHTML = MOCK_DB.submissions.map(s => `
      <tr>
        <td><strong>${s.studentName}</strong></td>
        <td>${s.assignmentTitle || 'Assignment'}</td>
        <td>${s.submittedAt.split('T')[0]}</td>
        <td><span class="badge ${s.status === 'graded' ? 'badge-success' : 'badge-warning'}">${s.status}</span></td>
        <td>${s.pointsEarned ? s.pointsEarned + ' / 100' : '—'}</td>
        <td>
          <button class="btn btn-primary btn-sm" onclick="openGradingModal('${s.id}')">
            ${s.status === 'graded' ? 'Re-Grade' : 'Grade Submission'}
          </button>
        </td>
      </tr>
    `).join('');
  }
}

function openGradingModal(submissionId) {
  const sub = MOCK_DB.submissions.find(s => s.id === submissionId);
  if (!sub) return;

  LMS_STATE.activeGradingSubmission = sub;
  document.getElementById('gradeStudentName').textContent = 'Student: ' + sub.studentName;
  document.getElementById('gradeAssignmentTitle').textContent = 'Assessment: ' + (sub.assignmentTitle || 'Assignment');
  document.getElementById('gradeSubmissionBody').textContent = sub.submissionText || 'No written remarks provided.';

  const fileContainer = document.getElementById('gradeFileLinkContainer');
  if (sub.fileDriveUrl) {
    fileContainer.innerHTML = `<a href="${sub.fileDriveUrl}" target="_blank" style="font-size: 12px; color: var(--primary); font-weight: 600;">📎 View Drive Attachment</a>`;
  } else {
    fileContainer.innerHTML = '';
  }

  document.getElementById('gradePointsInput').value = sub.pointsEarned || 95;
  document.getElementById('gradeFeedbackInput').value = sub.feedback || 'Well-structured assignment meeting all specifications.';

  openModal('modalGrading');
}

function handleGradingSubmit(e) {
  e.preventDefault();
  const sub = LMS_STATE.activeGradingSubmission;
  if (!sub) return;

  const points = Number(document.getElementById('gradePointsInput').value);
  const feedback = document.getElementById('gradeFeedbackInput').value;

  showLoading(true, 'Recording grade in Google Sheets database...');
  runServer('apiGradeSubmission', sub.id, points, feedback).then(res => {
    showLoading(false);
    closeModal('modalGrading');
    showToast('Grade and feedback published successfully!', 'success');
    renderLecturerDashboard();
  }).catch(err => {
    showLoading(false);
    showToast('Grading error: ' + err.message, 'danger');
  });
}

function renderAdminDashboard() {
  document.getElementById('adminTotalUsers').textContent = MOCK_DB.users.length;
  document.getElementById('adminTotalCourses').textContent = MOCK_DB.courses.length;
  document.getElementById('adminTotalEnrollments').textContent = MOCK_DB.enrollments.length;

function filterAdminUsers() {
  const query = (document.getElementById('adminUserSearchInput')?.value || '').toLowerCase();
  const tbody = document.getElementById('adminUsersTableBody');
  if (!tbody) return;

  const filtered = MOCK_DB.users.filter(u => !query || u.name.toLowerCase().includes(query) || u.email.toLowerCase().includes(query));

  tbody.innerHTML = filtered.map(u => `
    <tr>
      <td>
        <div style="display: flex; align-items: center; gap: 0.5rem;">
          <img src="${u.avatar}" class="user-avatar" style="width: 28px; height: 28px;">
          <strong>${u.name}</strong>
        </div>
      </td>
      <td>${u.email}</td>
      <td><span class="badge ${u.role === 'admin' ? 'badge-warning' : u.role === 'lecturer' ? 'badge-primary' : 'badge-success'}">${u.role}</span></td>
      <td><span class="badge ${u.status === 'active' ? 'badge-success' : 'badge-danger'}">${u.status}</span></td>
      <td>${u.joined || '2026-08-01'}</td>
      <td>
        <div style="display: flex; gap: 0.35rem;">
          <button class="btn btn-secondary btn-sm" onclick="toggleUserStatus('${u.id}')">${u.status === 'active' ? 'Deactivate' : 'Activate'}</button>
          <button class="btn btn-secondary btn-sm" onclick="adminResetPassword('${u.id}')">Reset Pass</button>
        </div>
      </td>
    </tr>
  `).join('');
}

function toggleUserStatus(userId) {
  const u = MOCK_DB.users.find(usr => usr.id === userId);
  if (!u) return;
  const newStatus = u.status === 'active' ? 'inactive' : 'active';
  
  runServer('apiAdminToggleUser', userId, newStatus).then(() => {
    u.status = newStatus;
    showToast(`User status updated to ${newStatus}.`, 'success');
    filterAdminUsers();
  });
}

function adminResetPassword(userId) {
  const u = MOCK_DB.users.find(usr => usr.id === userId);
  if (!u) return;
  showToast(`Password for ${u.name} reset to: TempPass2026!`, 'info');
}

function renderAdminLogs() {
  const tbody = document.getElementById('adminLogsTableBody');
  if (!tbody) return;
  tbody.innerHTML = MOCK_DB.logs.map(log => `
    <tr>
      <td style="white-space: nowrap; font-size: 12.5px; color: var(--text-muted);">${log.timestamp}</td>
      <td><strong>${log.userName}</strong></td>
      <td><span class="badge badge-primary">${log.action}</span></td>
      <td style="font-size: 13px;">${log.details}</td>
    </tr>
  `).join('');
}

function exportLmsData(tableName) {
  const data = tableName === 'Users' ? MOCK_DB.users : tableName === 'Enrollments' ? MOCK_DB.enrollments : MOCK_DB.logs;
  if (!data.length) {
    showToast('No records available to export.', 'warning');
    return;
  }

  // Convert array of objects to CSV
  const headers = Object.keys(data[0]);
  const csvRows = [headers.join(',')];
  data.forEach(item => {
    const values = headers.map(h => {
      const val = item[h] === undefined ? '' : String(item[h]).replace(/"/g, '""');
      return `"${val}"`;
    });
    csvRows.push(values.join(','));
  });

  const blob = new Blob([csvRows.join('\n')], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `LMS_${tableName}_${new Date().toISOString().split('T')[0]}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast(`Exported ${tableName} to CSV file!`, 'success');
}

// ==============================================================================

// ==============================================================================

function showAuthModal(mode = 'login') {
  toggleAuthForm(mode);
  openModal('modalAuth');
}

function toggleAuthForm(mode) {
  document.getElementById('formLogin').style.display = mode === 'login' ? 'block' : 'none';
  document.getElementById('formRegister').style.display = mode === 'register' ? 'block' : 'none';
  document.getElementById('formForgot').style.display = mode === 'forgot' ? 'block' : 'none';

  const titles = { login: 'Account Sign In', register: 'Student / Lecturer Registration', forgot: 'Password Recovery' };
  document.getElementById('authModalTitle').textContent = titles[mode];
}

function handleLoginSubmit(e) {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value;
  const pass = document.getElementById('loginPassword').value;

  showLoading(true, 'Verifying credentials with Google Sheets database...');
  runServer('apiLogin', email, pass).then(user => {
    showLoading(false);
    LMS_STATE.currentUser = user;
    LMS_STATE.currentRole = user.role;
    updateUserSessionUI();
    closeModal('modalAuth');
    showToast(`Welcome back, ${user.name}!`, 'success');
    navigate(user.role === 'admin' ? 'adminDashboard' : user.role === 'lecturer' ? 'lecturerDashboard' : 'studentDashboard');
  }).catch(err => {
    showLoading(false);
    showToast(err.message, 'danger');
  });
}

function handleRegisterSubmit(e) {
  e.preventDefault();
  const name = document.getElementById('regName').value;
  const email = document.getElementById('regEmail').value;
  const role = document.getElementById('regRole').value;
  const pass = document.getElementById('regPassword').value;

  showLoading(true, 'Registering user in Users table...');
  runServer('apiRegister', { name, email, role, password: pass }).then(user => {
    showLoading(false);
    LMS_STATE.currentUser = user;
    LMS_STATE.currentRole = user.role;
    updateUserSessionUI();
    closeModal('modalAuth');
    showToast(`Account created successfully! Welcome to the LMS.`, 'success');
    navigate(role === 'lecturer' ? 'lecturerDashboard' : 'studentDashboard');
  }).catch(err => {
    showLoading(false);
    showToast(err.message, 'danger');
  });
}

function handleForgotSubmit(e) {
  e.preventDefault();
  closeModal('modalAuth');
  showToast('Password reset link sent to your email address.', 'info');
}

function handleLogout() {
  LMS_STATE.currentUser = null;
  LMS_STATE.currentRole = 'student';
  updateUserSessionUI();
  showToast('You have been signed out.', 'info');
  navigate('landing');
}

function showRoleSwitcherModal() {
  openModal('modalRoleSwitcher');
}

function switchUserRole(role) {
  LMS_STATE.currentRole = role;
  if (role === 'student') LMS_STATE.currentUser = MOCK_DB.users[0];
  else if (role === 'lecturer') LMS_STATE.currentUser = MOCK_DB.users[1];
  else if (role === 'admin') LMS_STATE.currentUser = MOCK_DB.users[2];

  updateUserSessionUI();
  closeModal('modalRoleSwitcher');
  showToast(`Switched persona to: ${role.toUpperCase()}`, 'success');

  navigate(role === 'admin' ? 'adminDashboard' : role === 'lecturer' ? 'lecturerDashboard' : 'studentDashboard');
}

function enrollIntoCourse(courseId) {
  showLoading(true, 'Registering enrollment in Google Sheets...');
  runServer('apiEnrollCourse', LMS_STATE.currentUser?.id || 'usr_stud_1', courseId).then(res => {
    showLoading(false);
    showToast('Enrolled successfully! Redirecting to lesson player...', 'success');
    navigate('coursePlayer', { courseId });
  }).catch(err => {
    showLoading(false);
    showToast('Enrollment failed: ' + err.message, 'danger');
  });
}

// ==============================================================================
// MODAL & UTILITY HELPERS
// ==============================================================================

function openModal(modalId) {
  const modal = document.getElementById(modalId);
  if (modal) modal.classList.add('active');
}

function closeModal(modalId) {
  const modal = document.getElementById(modalId);
  if (modal) modal.classList.remove('active');
}

function showLoading(show, text = 'Processing...') {
  const overlay = document.getElementById('loadingOverlay');
  const txt = document.getElementById('loadingText');
  if (txt) txt.textContent = text;
  if (overlay) overlay.style.display = show ? 'flex' : 'none';
}

function showToast(message, type = 'info') {
  const container = document.getElementById('toastContainer');
  if (!container) return;

  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  toast.innerHTML = `<span>${type === 'success' ? '✓' : type === 'danger' ? '⚠️' : 'ℹ️'}</span> <div>${message}</div>`;
  
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(10px)';
    toast.style.transition = 'all 0.3s ease';
    setTimeout(() => toast.remove(), 300);
  }, 3500);
}
